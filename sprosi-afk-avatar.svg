<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#ff4a3d"/>
      <stop offset="0.55" stop-color="#c8141c"/>
      <stop offset="1" stop-color="#5a0008"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0306"/>
      <stop offset="1" stop-color="#14000a"/>
    </linearGradient>
    <linearGradient id="q" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a6e"/>
      <stop offset="1" stop-color="#ff2b2b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2a0004" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="640" height="640" fill="url(#bg)"/>

  <!-- Дорожки микросхемы на фоне -->
  <g stroke="#ff8a7a" stroke-opacity="0.16" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 150 H110 L150 190 H210"/>
    <path d="M0 470 H90 L130 430 H190"/>
    <path d="M640 170 H540 L500 210 H440"/>
    <path d="M640 480 H560 L520 440 H460"/>
    <path d="M200 0 V70 L240 110"/>
    <path d="M440 640 V575 L400 535"/>
  </g>
  <g fill="#ff8a7a" fill-opacity="0.22">
    <circle cx="210" cy="190" r="9"/><circle cx="190" cy="430" r="9"/>
    <circle cx="440" cy="210" r="9"/><circle cx="460" cy="440" r="9"/>
    <circle cx="240" cy="110" r="9"/><circle cx="400" cy="535" r="9"/>
  </g>

  <!-- Монитор -->
  <g filter="url(#shadow)">
    <rect x="160" y="150" width="320" height="230" rx="30" fill="#ffffff"/>
    <rect x="182" y="172" width="276" height="186" rx="16" fill="url(#screen)"/>
    <path d="M290 380 H350 L362 428 H278 Z" fill="#ffffff"/>
    <rect x="236" y="424" width="168" height="22" rx="11" fill="#ffffff"/>
  </g>

  <!-- Вопросительный знак на экране -->
  <g filter="url(#glow)" fill="none" stroke="url(#q)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M276 232 C276 200 298 186 320 186 C344 186 366 202 366 228 C366 256 334 262 324 280 C320 287 320 294 320 302"/>
  </g>
  <circle cx="320" cy="336" r="17" fill="#ff3b30" filter="url(#glow)"/>

  <!-- Надпись -->
  <text x="320" y="526" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" font-weight="900" font-size="78" letter-spacing="10" fill="#ffffff">AFK</text>
</svg>
