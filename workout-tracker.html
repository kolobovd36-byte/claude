<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Трекер">
<meta name="theme-color" content="#1c1c1e">
<title>Трекер</title>
<style>
  :root{
    --bg:#1c1c1e; --card:#26262a; --line:#333338; --muted:#8e8e93; --text:#fff; --btn:#303035;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
  body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 100px)}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input,select{font:inherit;color:var(--text);-webkit-user-select:text;user-select:text}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  h1{font-size:28px;font-weight:700;margin:0;letter-spacing:-.5px}
  .icons{display:flex;gap:6px}
  .icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
  .icon.on{color:var(--text);background:var(--btn)}
  .icon svg{width:21px;height:21px}

  .tabs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 18px;padding:0 16px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:8px 14px;border-radius:18px;font-size:14px;color:var(--muted);border:1px solid var(--line)}
  .tab.on{color:var(--bg);background:var(--text);border-color:var(--text);font-weight:600}

  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
  .sci{font-size:18px;font-weight:600;letter-spacing:-.2px;line-height:1.25}
  .ru{font-size:13px;color:var(--muted);margin-top:3px}
  .rows{margin-top:14px;display:grid;gap:10px}
  .row{display:flex;align-items:center;justify-content:space-between}
  .label{font-size:13px;color:var(--muted);width:80px}
  .ctrl{display:flex;align-items:center;gap:6px}
  .pm{width:40px;height:40px;border-radius:50%;background:var(--btn);display:grid;place-items:center}
  .pm:active{background:#45454b}
  .pm svg{width:18px;height:18px}
  .val{min-width:76px;text-align:center;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .val small{font-size:12px;color:var(--muted);font-weight:400;margin-left:2px}
  .sets{width:86px;height:40px;border-radius:12px;background:var(--btn);border:0;text-align:center;
    font-size:20px;font-weight:600;outline:none}
  .sets:focus{box-shadow:0 0 0 1.5px var(--text)}
  .last{font-size:12px;color:var(--muted);margin-top:12px;border-top:1px solid var(--line);padding-top:10px}

  .finish{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);
    height:54px;border-radius:16px;background:var(--text);color:var(--bg);font-weight:600;font-size:17px}
  .finish:active{opacity:.85}

  /* edit */
  .field{width:100%;background:var(--btn);border:0;border-radius:10px;padding:10px 12px;margin-top:8px;outline:none;font-size:15px}
  .field.big{font-size:17px;font-weight:600}
  .ghost{width:100%;padding:14px;border-radius:14px;border:1px dashed #4a4a50;color:var(--muted);margin-bottom:12px}
  .del{color:#ff6b6b;font-size:14px;margin-top:10px}
  .sect{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:26px 0 10px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}

  /* history */
  .hday{font-size:13px;color:var(--muted);margin-bottom:8px}
  .hline{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
  .hline:first-of-type{border-top:0}
  .hline span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:10px}
  .empty{color:var(--muted);text-align:center;margin-top:60px}

  .bar{height:4px;border-radius:2px;background:var(--btn);margin:14px 0 8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--text);border-radius:2px}
  .bline{display:flex;align-items:center;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line);gap:10px}
  .card .hday + .bline{border-top:0}
  .bl{flex:1;font-size:15px;color:var(--muted)}
  .bl small{display:block;font-size:12px;margin-top:2px;color:#6c6c70}
  .bw{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .bline.test .bl{color:var(--text);font-weight:600}
  .bline.next .bl{color:var(--text)}
  .bline.next .chk{border-color:var(--text)}
  .chk{width:28px;height:28px;flex:none;border-radius:50%;border:1.5px solid #4a4a50;display:grid;place-items:center}
  .chk.on{background:var(--text);border-color:var(--text);color:var(--bg)}
  .chk svg{width:16px;height:16px}
  .pie{display:flex;align-items:center;gap:18px}
  .legend{flex:1;display:grid;gap:9px;font-size:14px;color:var(--muted)}
  .legend div{display:flex;align-items:center;gap:8px}
  .legend i{width:10px;height:10px;border-radius:50%;flex:none}
  .legend b{margin-left:auto;color:var(--text);font-variant-numeric:tabular-nums}
  .big{font-size:28px;font-weight:700;letter-spacing:-.5px}
  .big small{font-size:14px;color:var(--muted);font-weight:400}
  .bars{display:flex;gap:10px;margin-top:16px;height:150px}
  .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
  .btrack{flex:1;width:100%;max-width:44px;display:flex;align-items:flex-end;background:#2e2e33;border-radius:8px;overflow:hidden}
  .btrack div{width:100%;border-radius:8px}
  .bval{font-size:13px;font-weight:600}
  .bdate{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .trend{font-size:26px;font-weight:700;text-align:right;line-height:1;flex:none}
  .trend small{display:block;font-size:11px;font-weight:400;margin-top:4px;color:var(--muted)}
  .cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
  .cmp div{background:#2e2e33;border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}
  .cmp span{display:block;font-size:11px;margin-bottom:2px}
  .cmp b{font-size:17px;color:var(--text);font-variant-numeric:tabular-nums}
  .spark{width:100%;height:56px;display:block;margin-top:6px}
  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-80px);
    background:var(--text);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;font-weight:600;
    transition:transform .25s;white-space:nowrap}
  .toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const MINUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>';
const I_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>';
const I_PROG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l3.5-4 3 2.5L19 8"/></svg>';
const I_HIST = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';

const r1 = x => Math.round(x*10)/10;
const uniq = a => [...new Set(a.map(r1))].filter(x => x > 0).sort((a,b)=>a-b);
// стек тренажёра: шаг × k (+ опционально добивка)
const stack = (step, max, add=0) => uniq([].concat(...Array.from({length: Math.floor(max/step)}, (_,i)=>{ const v=(i+1)*step; return add ? [v, v+add] : [v]; })));
// значения вокруг текущего веса
const around = (v, step, n=16) => uniq(Array.from({length: n*2+1}, (_,i)=> v + (i-n)*step));
function uid(){ return Math.random().toString(36).slice(2,9); }

// sci, ru, weight, list весов зала, reps (число или [пр, л]), sets
const ex = (sci, ru, weight, list, reps=8, sets=1) => {
  const uni = Array.isArray(reps);
  return { id: uid(), sci, ru, weight, w: uniq([...list, weight]), uni,
    reps: uni ? reps[0] : reps, repsL: uni ? reps[1] : reps, sets: String(sets) };
};

const CABLE = stack(2.25, 90);              // кроссовер: 13.5, 33.8 …
const DEFAULT_DAYS = () => [
  { id: uid(), name:'Anterior', items:[
    ex('Cable Lateral Raise (cuffed)', 'Махи в стороны в кроссовере, манжета', 13.5, CABLE, [10,9], 1),
    ex('Close-Grip Seated Press, 80°', 'Жим узким хватом сидя, спинка 80°', 45, around(45,2.5), 11, 2),
    ex('Smith Machine Incline Press, 30–40° (dead-stop)', 'Жим в Смите 30–40°, с остановкой', 40, around(40,2.5), 8, 2),
    ex('Cable Shoulder Flexion (cuffed)', 'Подъём руки вперёд в кроссовере, манжета', 9, CABLE, [8,8], 1),
    ex('Leg Press (quadriceps emphasis)', 'Жим ногами, акцент на квадрицепс', 160, stack(5,400), 9, 2),
    ex('Unilateral Leg Extension', 'Разгибания ног по одной', 57.5, stack(5,120,7.5), [8,8], 1),
    ex('Reclined Biceps Curl', 'Сгибания на бицепс полулёжа', 68, around(68,2.5), 8, 1),
    ex('Dumbbell Hammer Curl', 'Молотки', 18, stack(2,50), [11,11], 1),
    ex('Cable Crunch', 'Скручивания', 15, around(15,2.5,6), 10, 2),
  ]},
  { id: uid(), name:'Posterior', items:[
    ex('Cable Lateral Raise (cuffed)', 'Махи в стороны в кроссовере, манжета', 13.5, CABLE, [10,9], 1),
    ex('Calf Press', 'Жим икрами', 135, stack(5,300), 10, 2),
    ex('Chest-Supported Smith Machine Row', 'Тяга в Смите с упором грудью', 100, around(100,2.5), 9, 2),
    ex('Lat Pulldown', 'Вертикальная тяга', 107, around(107,4.5), 7, 2),
    ex('Seated Leg Curl', 'Сгибания ног сидя', 70.5, stack(9,150,7.5), 9, 2),
    ex('Reverse Pec Deck Fly', 'Задние дельты', 88.5, stack(9,150,7.5), 9, 2),
    ex('Cable Triceps Pushdown (cuffed)', 'Разгибания на трицепс одной рукой, манжета', 33.8, CABLE, [10,10], 1),
    ex('Back Extension', 'Гиперэкстензия', 55, around(55,2.5), 8, 1),
  ]},
  BENCH_DAY(),
];

// ===== Жимовая программа 2 =====
const L = (w, sc, done=false) => ({ id: uid(), t:'light', w, sc, done });
const H = (w, sc, done=false) => ({ id: uid(), t:'heavy', w, sc, done });
const T = (w, note='', done=false) => ({ id: uid(), t:'test', w, sc:'', note, done });
const BENCH_DAY = () => ({ id: uid(), name:'Bench Press', kind:'bench',
  sci:'Barbell Bench Press', ru:'Жимовая программа 2 · старт 75×10, шаг +5 кг',
  weeks: [
    { n:'1 неделя',  items:[ L(75,'3×5',1), H(75,'3×6',1) ] },
    { n:'2 неделя',  items:[ L(80,'3×4',1), H(80,'3×5',1) ] },
    { n:'3 неделя',  items:[ L(85,'3×3',1), H(85,'3×4',1), T(100,'в сб') ] },
    { n:'4 неделя',  items:[ L(80,'3×5',1), H(80,'3×6',1) ] },
    { n:'5 неделя',  items:[ L(85,'3×4',1), H(85,'3×5',1), T(100,'29.10.2026') ] },
    { n:'8 неделя',  items:[ L(85,'3×4',1), H(85,'3×5',1) ] },
    { n:'7 неделя',  items:[ L(90,'3×4'),   H(90,'3×5'),   T(110,'15.06.2026') ] },
    { n:'10 неделя', items:[ L(90,'2 · 4 · 3'), H(90,'3×5') ] },
    { n:'11 неделя', items:[ L(95,'3×4'),   H(95,'3×5') ] },
    { n:'12 неделя', items:[ L(90,'3×4'),   H(90,'3×5'),   T(115,'06.07.2026') ] },
  ]});
const TLBL = { light:'Лёгкая', heavy:'Тяжёлая', test:'Проходка' };
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const allBench = d => d.weeks.flatMap(w => w.items);

function benchView(d){
  const all = allBench(d), done = all.filter(x=>x.done).length;
  const next = all.find(x => !x.done);
  let h = `<div class="card"><div class="sci">${esc(d.sci)}</div><div class="ru">${esc(d.ru)}</div>
    <div class="bar"><i style="width:${all.length? done/all.length*100 : 0}%"></i></div>
    <div class="ru">Выполнено ${done} из ${all.length}${next ? ` · дальше: ${TLBL[next.t].toLowerCase()} ${fmt(next.w)} кг${next.sc?' '+esc(next.sc):''}` : ' · программа пройдена'}</div></div>`;
  h += d.weeks.map(w => `<div class="card">
    <div class="hday">${esc(w.n)}</div>
    ${w.items.map(it => `<button class="bline ${it.t==='test'?'test':''} ${it===next?'next':''}" data-a="bdone" data-id="${it.id}">
      <span class="bl">${TLBL[it.t]}${it.note?`<small>${esc(it.note)}</small>`:''}</span>
      <span class="bw">${fmt(it.w)} кг${it.sc?` · ${esc(it.sc)}`:''}</span>
      <span class="chk ${it.done?'on':''}">${it.done?CHECK:''}</span>
    </button>`).join('')}
  </div>`).join('');
  return h;
}

function benchEdit(d){
  let h = `<div class="card"><div class="ru">Название вкладки</div>
    <input class="field big" value="${esc(d.name)}" data-f="dayname">
    <input class="field" value="${esc(d.sci)}" data-f="bsci" placeholder="Научное название">
    <input class="field" value="${esc(d.ru)}" data-f="bru" placeholder="Описание"></div>`;
  h += d.weeks.map((w,wi) => `<div class="card">
    <input class="field big" value="${esc(w.n)}" data-f="bweek" data-i="${wi}">
    ${w.items.map(it => `<div class="ru" style="margin-top:12px">${TLBL[it.t]}</div>
      <div style="display:flex;gap:8px">
        <input class="field" style="width:34%" inputmode="decimal" value="${fmt(it.w)}" data-f="bw" data-id="${it.id}" placeholder="кг">
        <input class="field" value="${esc(it.t==='test'?it.note:it.sc)}" data-f="${it.t==='test'?'bnote':'bsc'}" data-id="${it.id}" placeholder="${it.t==='test'?'дата':'3×5'}">
      </div>`).join('')}
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      ${['light','heavy','test'].map(t=>`<button class="tab" data-a="badd" data-t="${t}" data-i="${wi}">+ ${TLBL[t]}</button>`).join('')}
      <button class="tab" data-a="bpop" data-i="${wi}">− последняя</button>
    </div>
    <button class="del" data-a="bdelweek" data-i="${wi}">Удалить неделю</button>
  </div>`).join('');
  h += `<button class="ghost" data-a="baddweek">+ Неделя</button>`;
  h += `<button class="ghost" data-a="resetbench" style="color:#ff6b6b">Вернуть исходную жимовую программу</button>`;
  return h;
}
const findB = id => allBench(day()).find(x => x.id === id);

// ===== Прогресс =====
// условный 1ПМ (Эпли): учитывает и вес, и повторы
const e1rm = it => { const r = it.uni ? (it.reps + it.repsL)/2 : it.reps; return it.weight * (1 + r/30); };
const C_UP = '#30d158', C_FLAT = '#636366', C_DOWN = '#ff6b6b';

function series(){
  const m = new Map();
  S.history.forEach(w => w.items.forEach(it => {
    if (!m.has(it.sci)) m.set(it.sci, { sci: it.sci, ru: it.ru, pts: [] });
    m.get(it.sci).pts.push({ date: w.date, weight: it.weight, reps: repsTxt(it), e: e1rm(it) });
  }));
  return [...m.values()].map(x => {
    const p = x.pts, last = p[p.length-1], prev = p[p.length-2], first = p[0];
    let st = 'new';
    if (prev) { const d = (last.e - prev.e) / prev.e; st = d > 0.005 ? 'up' : d < -0.005 ? 'down' : 'flat'; }
    return { ...x, first, last, prev, st, gain: (last.e - first.e) / first.e * 100 };
  });
}

function donut(parts){
  const total = parts.reduce((s,p)=>s+p.v,0), R = 52, C = 2*Math.PI*R;
  let off = 0;
  const arcs = total ? parts.filter(p=>p.v).map(p => {
    const len = p.v/total*C, gap = parts.filter(q=>q.v).length > 1 ? 3 : 0;
    const a = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="14"
      stroke-dasharray="${Math.max(len-gap,0)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;
    off += len; return a;
  }).join('') : `<circle r="${R}" cx="70" cy="70" fill="none" stroke="#333338" stroke-width="14"/>`;
  return `<svg viewBox="0 0 140 140" width="140" height="140">${arcs}
    <text x="70" y="68" text-anchor="middle" fill="${parts[0].v?C_UP:'#fff'}" font-size="30" font-weight="700">${parts[0].v}</text>
    <text x="70" y="88" text-anchor="middle" fill="#8e8e93" font-size="11">из ${total} растут</text></svg>`;
}

function spark(pts, color){
  const W = 300, Hh = 56, P = 6, v = pts.map(p=>p.e);
  if (v.length < 2) return '';
  const mn = Math.min(...v), mx = Math.max(...v), rg = mx - mn || 1;
  const xy = v.map((y,i)=>[P + i*(W-2*P)/(v.length-1), Hh-P - (y-mn)/rg*(Hh-2*P)]);
  return `<svg class="spark" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">
    <polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===xy.length-1?3.5:2.2}" fill="${i===xy.length-1?color:'#8e8e93'}"/>`).join('')}
  </svg>`;
}

function progressView(){
  const sr = series(), bench = S.days.find(d => d.kind === 'bench');
  let h = '';
  if (!sr.length && !bench) return `<div class="empty">Пока нет данных.<br>Заверши пару тренировок — тут появится прогресс.</div>`;

  if (sr.length) {
    const cnt = k => sr.filter(x=>x.st===k).length;
    const parts = [{k:'up',l:'Растут',c:C_UP,v:cnt('up')},{k:'flat',l:'На месте',c:C_FLAT,v:cnt('flat')},{k:'down',l:'Падают',c:C_DOWN,v:cnt('down')}];
    const fresh = cnt('new');
    h += `<div class="card pie">${donut(parts)}<div class="legend">
      ${parts.map(p=>`<div><i style="background:${p.c}"></i>${p.l}<b>${p.v}</b></div>`).join('')}
      ${fresh?`<div><i style="background:transparent;border:1.5px solid #4a4a50"></i>Мало данных<b>${fresh}</b></div>`:''}
    </div></div>
    <div class="hint" style="margin:-4px 2px 18px">Сравнение последней тренировки с предыдущей. Считается по весу и повторам вместе: +1 повтор с тем же весом — это тоже рост.</div>`;
  }

  if (bench) {
    const tests = allBench(bench).filter(x => x.t==='test');
    const all = allBench(bench), done = all.filter(x=>x.done).length;
    const best = Math.max(0, ...tests.filter(x=>x.done).map(x=>x.w));
    const mx = Math.max(...tests.map(x=>x.w), 1);
    h += `<div class="sect" style="margin-top:4px">Жим лёжа</div><div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div><div class="big">${best ? fmt(best) : '—'}<small> кг</small></div><div class="ru">лучшая проходка</div></div>
        <div style="text-align:right"><div class="big">${done}<small> / ${all.length}</small></div><div class="ru">тренировок программы</div></div>
      </div>
      <div class="bars">${tests.map(t=>`<div class="bcol"><div class="bval">${fmt(t.w)}</div>
        <div class="btrack"><div style="height:${t.w/mx*100}%;background:${t.done?'#fff':'#3a3a3f'}"></div></div>
        <div class="bdate">${esc(t.note||'—')}</div></div>`).join('')}</div>
      <div class="ru" style="margin-top:8px">Белые — пройдены, серые — ещё впереди</div>
    </div>`;
  }

  if (sr.length) {
    const order = {down:0, flat:1, up:2, new:3};
    h += `<div class="sect">Упражнения</div>`;
    h += sr.sort((a,b)=>order[a.st]-order[b.st]).map(x => {
      const c = {up:C_UP, flat:C_FLAT, down:C_DOWN, new:C_FLAT}[x.st];
      const arrow = {up:'↑', flat:'→', down:'↓', new:'•'}[x.st];
      const dw = x.prev ? r1(x.last.weight - x.prev.weight) : 0;
      const word = {up:'растёт', flat:'на месте', down:'просел', new:'первая запись'}[x.st];
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <div><div class="sci" style="font-size:16px">${esc(x.sci)}</div><div class="ru">${esc(x.ru)}</div></div>
          <div class="trend" style="color:${c}">${arrow}<small>${word}</small></div>
        </div>
        <div class="cmp">
          <div><span>Было</span><b>${fmt(x.first.weight)}</b> × ${x.first.reps}</div>
          <div><span>Прошлая</span><b>${x.prev?fmt(x.prev.weight):'—'}</b>${x.prev?' × '+x.prev.reps:''}</div>
          <div><span>Сейчас</span><b style="color:${x.st==='down'?C_DOWN:x.st==='up'?C_UP:'#fff'}">${fmt(x.last.weight)}</b> × ${x.last.reps}</div>
        </div>
        ${spark(x.pts, c)}
        <div class="ru" style="margin-top:6px">${x.pts.length} трен. · ${x.prev ? (dw ? `вес ${dw>0?'+':''}${fmt(dw)} кг к прошлой · ` : '') : ''}сила с начала ${x.gain>=0?'+':''}${fmt(x.gain)}%</div>
      </div>`;
    }).join('');
  }
  return h;
}

// ===== Хранилище =====
const KEY = 'workout-tracker-v2';
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if (!S || !S.days) S = { days: DEFAULT_DAYS(), history: [], cur: 0 };
if (!S.days.some(d => d.kind === 'bench')) {
  const i = S.days.findIndex(d => d.name === 'Bench Press');
  if (i >= 0) S.days[i] = BENCH_DAY(); else S.days.push(BENCH_DAY());
}
let view = 'main'; // main | edit | history
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

const fmt = n => r1(n).toString().replace('.', ',');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day = () => S.days[S.cur] || S.days[0];
const repsTxt = i => i.uni ? `${i.reps}/${i.repsL}` : i.reps;

function lastFor(sci){
  for (let i = S.history.length-1; i >= 0; i--) {
    const it = S.history[i].items.find(x => x.sci === sci);
    if (it) return { ...it, date: S.history[i].date };
  }
  return null;
}

// ===== Рендер =====
function render(){
  const app = document.getElementById('app');
  const title = {edit:'Правка', history:'История', progress:'Прогресс'}[view] || 'Тренировка';
  let h = `<header><h1>${title}</h1><div class="icons">
    <button class="icon ${view==='progress'?'on':''}" data-a="view" data-v="progress">${I_PROG}</button>
    <button class="icon ${view==='history'?'on':''}" data-a="view" data-v="history">${I_HIST}</button>
    <button class="icon ${view==='edit'?'on':''}" data-a="view" data-v="edit">${I_EDIT}</button>
  </div></header>`;
  if (view !== 'history' && view !== 'progress') {
    h += `<div class="tabs">${S.days.map((d,i)=>`<button class="tab ${i===S.cur?'on':''}" data-a="day" data-i="${i}">${esc(d.name)}</button>`).join('')}</div>`;
  }
  const isB = (view === 'main' || view === 'edit') && day().kind === 'bench';
  if (view === 'main') h += isB ? benchView(day()) : mainView();
  if (view === 'edit') h += isB ? benchEdit(day()) + `<div class="sect">Данные</div><button class="ghost" data-a="reset" style="color:#ff6b6b">Сбросить всё</button>` : editView();
  if (view === 'history') h += historyView();
  if (view === 'progress') h += progressView();
  app.innerHTML = h;
}

const stepper = (label, act, id, val, unit='') => `<div class="row"><span class="label">${label}</span><div class="ctrl">
  <button class="pm" data-a="${act}" data-d="-1" data-id="${id}">${MINUS}</button>
  <div class="val">${val}${unit?`<small>${unit}</small>`:''}</div>
  <button class="pm" data-a="${act}" data-d="1" data-id="${id}">${PLUS}</button>
</div></div>`;

function mainView(){
  const d = day();
  if (!d.items.length) return `<div class="empty">Нет упражнений.<br>Добавь их в режиме правки.</div>`;
  const total = d.items.reduce((s,e)=> s + (parseInt(e.sets)||0), 0);
  return `<div class="ru" style="margin:-8px 0 12px">Подходов за день: ${total}</div>` + d.items.map(e => {
    const last = lastFor(e.sci);
    return `<div class="card">
      <div class="sci">${esc(e.sci)}</div>
      <div class="ru">${esc(e.ru)}</div>
      <div class="rows">
        ${stepper('Вес','w',e.id,fmt(e.weight),'кг')}
        ${e.uni ? stepper('Повт. пр','r',e.id,e.reps) + stepper('Повт. лев','rl',e.id,e.repsL) : stepper('Повторы','r',e.id,e.reps)}
        <div class="row"><span class="label">Подходы</span>
          <input class="sets" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="${esc(e.sets)}" data-id="${e.id}" data-f="sets">
        </div>
      </div>
      ${last ? `<div class="last">Прошлый раз: ${fmt(last.weight)} кг × ${repsTxt(last)} × ${last.sets} · ${new Date(last.date).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}</div>` : ''}
    </div>`;
  }).join('') + `<button class="finish" data-a="finish">Завершить тренировку</button>`;
}

function editView(){
  const d = day();
  let h = `<div class="card"><div class="ru">Название дня</div>
    <input class="field big" value="${esc(d.name)}" data-f="dayname"></div>`;
  h += d.items.map(e => `<div class="card">
    <input class="field big" value="${esc(e.sci)}" placeholder="Научное название" data-id="${e.id}" data-f="sci">
    <input class="field" value="${esc(e.ru)}" placeholder="Русское название" data-id="${e.id}" data-f="ru">
    <div class="ru" style="margin-top:12px">Веса этого тренажёра в зале</div>
    <input class="field" value="${e.w.map(fmt).join('; ')}" data-id="${e.id}" data-f="wlist" inputmode="decimal">
    <button class="tab ${e.uni?'on':''}" style="margin-top:10px" data-a="uni" data-id="${e.id}">Право / лево отдельно</button>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <button class="del" data-a="delex" data-id="${e.id}">Удалить упражнение</button>
      <span>
        <button class="tab" style="margin-top:10px" data-a="mv" data-d="-1" data-id="${e.id}">↑</button>
        <button class="tab" style="margin-top:10px" data-a="mv" data-d="1" data-id="${e.id}">↓</button>
      </span>
    </div>
  </div>`).join('');
  h += `<div class="hint" style="margin:-4px 0 14px">Веса через точку с запятой: 50; 57,5; 60 — плюсики переключают именно их.</div>`;
  h += `<button class="ghost" data-a="addex">+ Упражнение</button>
        <div style="display:flex;gap:10px"><button class="ghost" data-a="addday">+ День</button>
        ${S.days.length>1?`<button class="ghost" data-a="delday" style="color:#ff6b6b">Удалить день</button>`:''}</div>`;
  h += `<div class="sect">Данные</div><button class="ghost" data-a="reset" style="color:#ff6b6b">Сбросить всё</button>`;
  return h;
}

function historyView(){
  if (!S.history.length) return `<div class="empty">Пока пусто.<br>Заверши первую тренировку.</div>`;
  return S.history.slice().reverse().map((w, ri) => {
    const idx = S.history.length - 1 - ri;
    return `<div class="card">
      <div class="hday">${new Date(w.date).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'})} · ${esc(w.day)}</div>
      ${w.items.map(i=>`<div class="hline"><span>${esc(i.sci)}</span><span>${fmt(i.weight)} × ${repsTxt(i)} × ${i.sets}</span></div>`).join('')}
      <button class="del" data-a="delhist" data-i="${idx}">Удалить запись</button>
    </div>`;
  }).join('');
}

function toast(t){
  const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove('show'), 1600);
}

// двойное нажатие вместо confirm()
function sure(b){
  if (b.dataset.armed) return true;
  b.dataset.armed = '1'; const t = b.textContent; b.textContent = 'Нажми ещё раз';
  setTimeout(()=>{ delete b.dataset.armed; b.textContent = t; }, 2500);
  return false;
}

const find = id => (day().items || []).find(e => e.id === id);
const DANGER = ['delex','delday','delhist','reset','bdelweek','resetbench'];

// ===== События =====
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, e = b.dataset.id ? find(b.dataset.id) : null, dd = +b.dataset.d;
  if (DANGER.includes(a) && !sure(b)) return;

  if (a === 'view') { view = view === b.dataset.v ? 'main' : b.dataset.v; render(); return; }
  if (a === 'day') { S.cur = +b.dataset.i; save(); render(); scrollTo(0,0); return; }

  if (a === 'w') {
    const list = e.w.length ? e.w : [e.weight];
    let i = list.findIndex(x => x >= e.weight - 1e-9);
    if (i === -1) i = list.length - 1;
    if (list[i] !== e.weight && dd < 0) i++;
    e.weight = list[Math.max(0, Math.min(list.length-1, i + dd))];
  }
  if (a === 'r')  e.reps  = Math.max(0, Math.min(99, e.reps + dd));
  if (a === 'rl') e.repsL = Math.max(0, Math.min(99, e.repsL + dd));
  if (a === 'uni') e.uni = !e.uni;
  if (a === 'mv') {
    const it = day().items, i = it.indexOf(e), j = i + dd;
    if (j >= 0 && j < it.length) [it[i], it[j]] = [it[j], it[i]];
  }

  if (a === 'finish') {
    const d = day();
    S.history.push({ date: Date.now(), day: d.name,
      items: d.items.map(({sci,ru,weight,reps,repsL,uni,sets}) => ({sci,ru,weight,reps,repsL,uni,sets: sets||'0'})) });
    toast('Тренировка сохранена');
  }
  if (a === 'bdone') { const it = findB(b.dataset.id); it.done = !it.done; if (it.done) toast(TLBL[it.t] + ' ✓'); }
  if (a === 'badd') { const c = {light:L,heavy:H,test:T}[b.dataset.t]; day().weeks[+b.dataset.i].items.push(b.dataset.t==='test' ? c(100,'') : c(80,'3×5')); }
  if (a === 'bpop') day().weeks[+b.dataset.i].items.pop();
  if (a === 'bdelweek') day().weeks.splice(+b.dataset.i, 1);
  if (a === 'baddweek') { const d = day(); d.weeks.push({ n: (d.weeks.length+1) + ' неделя', items:[ L(80,'3×4'), H(80,'3×5') ] }); }
  if (a === 'resetbench') S.days[S.cur] = BENCH_DAY();
  if (a === 'addex') day().items.push(ex('New Exercise','Новое упражнение',20,around(20,2.5),8,1));
  if (a === 'delex') day().items = day().items.filter(x => x.id !== e.id);
  if (a === 'addday') { S.days.push({ id: uid(), name: 'День ' + (S.days.length+1), items: [] }); S.cur = S.days.length-1; }
  if (a === 'delday') { S.days.splice(S.cur,1); S.cur = 0; }
  if (a === 'delhist') S.history.splice(+b.dataset.i, 1);
  if (a === 'reset') { S = { days: DEFAULT_DAYS(), history: [], cur: 0 }; view = 'main'; }

  save(); render();
});

document.addEventListener('input', ev => {
  const t = ev.target, f = t.dataset.f; if (!f) return;
  if (f === 'sets') { t.value = t.value.replace(/\D/g,''); find(t.dataset.id).sets = t.value; }
  if (f === 'sci' || f === 'ru') find(t.dataset.id)[f] = t.value;
  if (f === 'bsci') day().sci = t.value;
  if (f === 'bru') day().ru = t.value;
  if (f === 'bweek') day().weeks[+t.dataset.i].n = t.value;
  if (f === 'bsc') findB(t.dataset.id).sc = t.value;
  if (f === 'bnote') findB(t.dataset.id).note = t.value;
  if (f === 'bw') { const v = parseFloat(t.value.replace(',','.')); if (!isNaN(v)) findB(t.dataset.id).w = v; }
  if (f === 'dayname') { day().name = t.value; document.querySelector('.tab.on').textContent = t.value; }
  save();
});

document.addEventListener('change', ev => {
  const t = ev.target, f = t.dataset.f; if (f !== 'wlist') return;
  const e = find(t.dataset.id);
  const list = uniq(t.value.split(/[;\s]+/).map(x => parseFloat(x.replace(',','.'))).filter(x => !isNaN(x)));
  if (list.length) {
    e.w = list;
    e.weight = list.reduce((p,c) => Math.abs(c-e.weight) < Math.abs(p-e.weight) ? c : p, list[0]);
    t.value = list.map(fmt).join('; '); toast('Веса обновлены');
  }
  save();
});

document.addEventListener('keydown', ev => { if (ev.key === 'Enter') ev.target.blur(); });

render();
</script>
</body>
